[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanpulse-ai"
version = "0.1.0"
description = "Hourly bike-sharing demand analysis project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=12.0"]

[project.optional-dependencies]
analysis = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyterlab>=4.0",
]
dashboard = [
    "streamlit>=1.51",
    "plotly>=5.22",
]
ml = [
    "scikit-learn>=1.4",
]

[project.scripts]
urbanpulse-ingest = "urbanpulse.ingest:main"
urbanpulse-validate = "urbanpulse.validation:main"
urbanpulse-prepare = "urbanpulse.prepare:main"
urbanpulse-baseline = "urbanpulse.ml.baseline:main"
urbanpulse-ridge = "urbanpulse.ml.ridge:main"

[tool.setuptools.packages.find]
where = ["src"]
