[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanpulse-ai"
version = "0.1.0"
description = "Hourly bike-sharing demand analysis project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.scripts]
urbanpulse-ingest = "urbanpulse.ingest:main"
urbanpulse-validate = "urbanpulse.validation:main"

[tool.setuptools.packages.find]
where = ["src"]
